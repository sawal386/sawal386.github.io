<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog - Sawal Acharya</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            color: #222;
            margin: 0;
            padding: 40px 24px;
            line-height: 1.5;
        }
        .layout {
            display: flex;
            gap: 60px;
            max-width: 1100px;
            margin: 0 auto;
            align-items: flex-start;
        }

        /* Sidebar */
        .sidebar {
            flex: 0 0 240px;
        }
        .sidebar h1 {
            font-size: 28px;
            margin: 0 0 8px 0;
        }
        .sidebar .subtitle {
            color: #555;
            font-size: 15px;
            margin: 0 0 20px 0;
        }
        .sidebar hr {
            border: none;
            border-top: 1px solid #ddd;
            margin: 16px 0;
        }
        .sidebar nav {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 24px;
        }
        .sidebar nav a {
            color: #1a5fb4;
            text-decoration: none;
            font-size: 15px;
        }
        .sidebar nav a:hover {
            text-decoration: underline;
        }

        /* Main content */
        .content {
            flex: 1;
            min-width: 0;
        }
        .content h2 {
            font-size: 24px;
            margin-top: 0;
        }
        section {
            margin-bottom: 40px;
            padding-bottom: 24px;
            border-bottom: 1px solid #eee;
        }
        section:last-child {
            border-bottom: none;
        }
        a {
            color: #1a5fb4;
        }

        @media (max-width: 700px) {
            .layout {
                flex-direction: column;
            }
            .sidebar {
                flex: 1 1 auto;
            }
        }
    </style>
</head>
<body>
    <div class="layout">
        <aside class="sidebar">
            <h1>Sawal Acharya</h1>
            <p class="subtitle">PhD Student in Computer Science, Johns Hopkins University</p>
            <hr>
            <nav>
                <a href="index.html#about">About</a>
                <a href="index.html#research">Research</a>
                <a href="index.html#teaching">Teaching</a>
                <a href="blog.html">Blog</a>
                <a href="index.html#contact">Contact</a>
            </nav>
        </aside>

        <main class="content">
            <section id="blog">
                <h2>Blog</h2>
                <p>Posts coming soon.</p>
            </section>

            <section id="outdoor-adventures">
                <h2>Outdoor Adventures</h2>
                <ul>
                    <li><a href="#">Annapurna Base Camp (coming soon)</a></li>
                    <li><a href="#">Mount Fuji (coming soon)</a></li>
                    <li><a href="#">Lac Blanc (coming soon)</a></li>
                </ul>
            </section>
        </main>
    </div>
</body>
</html>
